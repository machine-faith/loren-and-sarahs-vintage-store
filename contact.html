<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contact : YOUR STORE NAME</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <meta name="theme-color" content="#000">
    <meta name="description" content="Get in touch — inquiries, press, collaboration">
</head>
<body>
    <div class="container">

        <!-- ========== NAVIGATION ========== -->
        <header>
            <nav>
                <div class="row">
                    <a href="shop.html" title="Shop">Shop</a>
                    <a href="lookbook.html" title="Lookbook">Lookbook</a>
                    <a href="about.html" title="About">About</a>
                </div>
                <div class="row">
                    <a href="contact.html" title="Contact" class="current-section">Contact</a>
                    <a href="#" title="Instagram" target="_blank" rel="noopener">Instagram</a>
                    <a href="#" title="Depop" target="_blank" rel="noopener">Depop</a>
                </div>
            </nav>
        </header>

        <!-- ========== CONTACT ========== -->
        <main>
            <h1>Contact</h1>

            <section class="contact-page">

                <!-- Email -->
                <p style="color:#999; margin-bottom:0.5rem; font-size:0.8rem; letter-spacing:0.1em;">
                    For inquiries, press & collaborations
                </p>
                <a href="mailto:your@email.com" class="email-link">
                    <!-- REPLACE with your actual email -->
                    your@email.com
                </a>

                <!-- Social Links -->
                <div class="social-links">
                    <a href="#" target="_blank" rel="noopener">Instagram</a>
                    <a href="#" target="_blank" rel="noopener">Depop</a>
                    <!-- Add TikTok, etc. as needed:
                    <a href="#" target="_blank" rel="noopener">TikTok</a>
                    -->
                </div>

                <!-- Optional: Shipping / Policies link -->
                <div style="margin-top:3rem; color:#555; font-size:0.75rem;">
                    <a href="#" style="color:#555;">Shipping & Returns</a>
                </div>
            </section>

            <!-- ========== EMAIL SIGNUP ========== -->
            <section class="email-signup">
                <p>Join our mailing list</p>
                <form action="#" method="post">
                    <input type="email" name="email" placeholder="your@email.com" required>
                    <button type="submit">Join</button>
                </form>
            </section>
        </main>

        <!-- ========== FOOTER ========== -->
        <footer class="mt-8">
            <nav>
                <div class="row">
                    <a href="shop.html">Shop</a>
                    <a href="lookbook.html">Lookbook</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </div>
            </nav>
        </footer>
    </div>

    <audio id="click-sound" src="assets/sounds/click.mp3" preload></audio>
    <script>
        document.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                var sound = document.getElementById('click-sound');
                if (sound) { sound.currentTime = 0; sound.play().catch(function() {}); }
            });
        });
    </script>
</body>
</html>
